name: Build Android APK

on:
  push:
    branches:
      - arena/e422f32f-fuzzy-eureka
    paths:
      - "portfolio/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor project
        run: |
          mkdir -p mobile
          cd mobile
          cat > package.json <<'EOF'
          {
            "name": "portfolio-app",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.portfolio.app",
            "appName": "Portfolio",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          mkdir -p www
          cp -r ../portfolio/. www/

      - name: Install Capacitor
        working-directory: mobile
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
